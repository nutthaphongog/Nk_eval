<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NK ELITE ACADEMY - ประเมินนักกีฬา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1322;--navy:#101a35;--navy2:#1b2850;--red:#e0222f;--line:#e3e6ee;--bg:#f2f4f9;--card:#fff;--mut:#667089;--ok:#16a34a}
*{box-sizing:border-box}
html{background:#050b1c}
body{margin:0;font-family:Prompt,system-ui,sans-serif;background:transparent;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
/* พื้นหลังแบบ FIFA: โปร่ง มีมิติ */
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:
 radial-gradient(70% 55% at 8% 0%,rgba(0,214,170,.30),transparent 62%),
 radial-gradient(60% 60% at 100% 8%,rgba(64,96,255,.38),transparent 62%),
 radial-gradient(55% 45% at 50% 105%,rgba(224,34,47,.28),transparent 65%),
 linear-gradient(160deg,#0a1f3d 0%,#07122b 50%,#050b1c 100%)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 linear-gradient(115deg,transparent 0 18%,rgba(255,255,255,.05) 18% 34%,transparent 34% 100%),
 linear-gradient(115deg,transparent 0 52%,rgba(255,255,255,.035) 52% 63%,transparent 63% 100%),
 linear-gradient(115deg,transparent 0 78%,rgba(255,255,255,.045) 78% 90%,transparent 90% 100%),
 radial-gradient(circle at 50% 40%,transparent 40%,rgba(0,0,0,.45) 100%)}
/* header + แท็บ */
.top{position:sticky;top:0;z-index:20;background:rgba(7,13,32,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;border-bottom:3px solid var(--red)}
.top>div{padding:0 18px;min-height:56px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top b{font-size:17px;font-weight:700;letter-spacing:.2px}.top small{color:#9aa6c8}
.tabs{display:flex;gap:2px;align-self:stretch;margin-left:8px}
.tab{display:flex;align-items:center;padding:0 16px;color:#9aa6c8;text-decoration:none;font-size:14px;font-weight:500;border-bottom:3px solid transparent;transition:color .15s,background .15s}
.tab:hover{color:#fff}
.tab.on{color:#fff;font-weight:600;border-bottom-color:#fff;background:linear-gradient(180deg,transparent,rgba(255,255,255,.12))}
.top button{margin-left:auto;background:transparent;color:#cdd5ee;border-color:#3a4772}
main{max-width:1040px;margin:0 auto;padding:22px 18px 100px;color:#fff}
h1{font-size:26px;margin:0;font-weight:700}h2{font-size:20px;margin:0 0 4px}h3{font-size:16px;margin:0}
button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;transition:background .15s,border-color .15s}
button:hover{background:#f6f7fb}
button.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}button.p:hover{background:#c91b27}
button.d{background:var(--navy);border-color:var(--navy);color:#fff}button.d:hover{background:var(--navy2)}
button.x{color:#b4232d;border-color:#f0c9cc}button.x:hover{background:#fdf1f2}
button.s{padding:5px 11px;font-size:13px;border-radius:8px}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,.fc:focus-visible{outline:3px solid #7b97ff;outline-offset:1px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:70px;resize:vertical}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
.mut{color:var(--mut);font-size:13px}
main .mut{color:#a9b8e2}
main section .mut,main .login .mut,main .bottom .mut{color:var(--mut)}
.bar1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.bar1 input{max-width:300px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.empty{background:#f7f8fc;border-radius:10px;padding:14px;text-align:center;color:var(--mut);font-size:13px;margin:14px 0 4px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 4px}
.b{text-align:center;font-size:12px}.b .t{height:46px;background:#edf0f6;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.b i{display:block;width:100%;background:var(--navy);border-radius:6px 6px 0 0}
.b span{display:block;font-weight:600;margin-top:3px}.b em{font-style:normal;color:var(--mut);font-size:11px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;color:var(--ink)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef0f5}
.row .n{flex:1;font-size:14px}
.rt{display:flex;gap:5px}.rt button{width:38px;height:38px;padding:0;border-radius:10px}
.rt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.dh b{color:var(--red);font-size:20px}
.lst{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #eef0f5}
.lst:first-child{border-top:0}.lst .bars{flex:1;margin:0;max-width:340px}.lst .mid{flex:1;cursor:pointer}
.pill{background:var(--navy);color:#fff;border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}.pill b{font-size:20px;display:block;line-height:1.1}.pill small{font-size:10px;opacity:.7}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--ink)}
dialog{border:0;border-radius:18px;padding:22px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(10,16,35,.35);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,16,35,.55)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 40px rgba(16,26,53,.12);color:var(--ink)}
.av{width:64px;height:64px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:600;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:92px;height:92px;font-size:34px;background:var(--navy);border-color:var(--line)}
.ph{display:flex;gap:16px;align-items:center;margin:8px 0 4px}.phb{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.grid.fg{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 16px}
.fc{cursor:pointer;text-align:center}
.phd{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:14px 0}.phd .fut{width:230px;margin:0}.pin{flex:1;min-width:200px}.pin .acts2{display:flex;gap:6px;margin-top:10px}

/* ===== การ์ด FIFA ===== */
.fut{container-type:inline-size;position:relative;width:100%;max-width:240px;aspect-ratio:.72;margin:0 auto;
 filter:drop-shadow(0 10px 16px rgba(0,0,0,.5));
 transform:perspective(900px) translateY(var(--ty,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));
 transition:transform .18s ease-out,filter .25s}
.fc:hover .fut,.fc.sel .fut{--ty:-6px;--sc:1.03}
.fc.sel .fut{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 16px rgba(110,190,255,.8)) drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.fo,.fm,.fi{position:absolute;clip-path:polygon(50% 0%,73% 2.4%,100% 5.4%,100% 85%,50% 100%,0% 85%,0% 5.4%,27% 2.4%)}
.fo{inset:0;background:linear-gradient(135deg,var(--bd1) 0,var(--bd2) 22%,var(--bd1) 45%,var(--bd2) 72%,var(--bd1) 100%)}
.fm{inset:1.5cqw;background:var(--bd2);background:linear-gradient(200deg,var(--bd2),color-mix(in srgb,var(--bd2) 40%,#000))}
.fi{inset:2.7cqw;background:linear-gradient(135deg,rgba(255,255,255,.32),transparent 26%,transparent 72%,rgba(0,0,0,.2)),radial-gradient(120% 70% at 72% 12%,var(--c2),transparent 62%),radial-gradient(90% 50% at 15% 100%,rgba(255,255,255,.18),transparent 70%),linear-gradient(172deg,var(--c2),var(--c1));color:var(--fg)}
.fi::before{content:'';position:absolute;inset:0;background:var(--pat,none);background-size:var(--pz,auto);pointer-events:none}
.fi::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);pointer-events:none}
.fut .ry{position:absolute;inset:0;background:repeating-conic-gradient(from 190deg at 72% 26%,rgba(255,255,255,.13) 0 7deg,transparent 7deg 16deg);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.fut .bw{position:absolute;left:0;right:0;top:30cqw;text-align:center;font-size:62cqw;font-weight:700;line-height:1;letter-spacing:-2cqw;opacity:.16;color:transparent;-webkit-text-stroke:.5cqw var(--fg)}
.fut .sw{position:absolute;left:-12cqw;right:-12cqw;top:63cqw;bottom:-5cqw;border-radius:50% 50% 0 0/12cqw 12cqw 0 0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.02));border-top:.5cqw solid rgba(255,255,255,.35)}
.fut .gl{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.34),transparent 48%);opacity:0;transition:opacity .2s;pointer-events:none}
.fut:hover .gl{opacity:1}
.fut .ov{position:absolute;left:10cqw;top:14cqw;display:flex;flex-direction:column;align-items:center;gap:1.4cqw;line-height:1}
.fut .ov b{font-size:20cqw;font-weight:700;text-shadow:0 .8cqw 0 rgba(255,255,255,.22)}
.fut .ov span{font-size:7.6cqw;font-weight:600;letter-spacing:.3cqw;min-width:11cqw;text-align:center;padding-bottom:1.6cqw;border-bottom:.45cqw solid var(--fg)}
.fut .ov i{width:9cqw;height:10.5cqw;margin-top:1.4cqw;background:var(--fg);color:var(--c1);font-style:normal;font-size:4cqw;font-weight:700;display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.fut .ph{position:absolute;right:6cqw;top:9cqw;width:60cqw;height:60cqw;display:grid;place-items:center;margin:0}
.fut .ph::before{content:'';position:absolute;inset:8% 4% 0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.42),transparent 68%)}
.fut .ph img,.fut .ph em{position:relative}
.fut .ph img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(#000 60%,transparent 100%);mask-image:linear-gradient(#000 60%,transparent 100%)}
.fut .ph em{font-style:normal;font-size:32cqw;font-weight:700;opacity:.3}
.fut .np{position:absolute;left:5cqw;right:5cqw;top:69.5cqw;height:12cqw;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.fut .np::after{content:'';position:absolute;inset:.45cqw;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:rgba(0,0,0,.17)}
.fut .nm{position:absolute;left:7cqw;right:7cqw;top:71cqw;text-align:center;font-size:8.6cqw;font-weight:700;text-transform:uppercase;letter-spacing:.3cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .5cqw 1cqw rgba(0,0,0,.2)}
.fut .ln{position:absolute;left:12cqw;right:12cqw;top:81.5cqw;height:.6cqw;background:linear-gradient(90deg,transparent,var(--fg),transparent);opacity:.6}
.fut .st{position:absolute;left:13cqw;right:13cqw;top:84cqw;display:grid;grid-template-columns:1fr 1fr}
.fut .st>div+div{border-left:.5cqw solid rgba(128,128,128,.35)}
.fut .st p{margin:0;display:flex;gap:2cqw;align-items:baseline;justify-content:center;font-size:6.2cqw;line-height:1.3;font-weight:500}
.fut .st b{font-size:9.4cqw;font-weight:700;min-width:12cqw;text-align:right}
.fut .ft{position:absolute;left:0;right:0;top:121cqw;text-align:center;font-size:4.8cqw;opacity:.8;font-weight:500}
.fut .ft:empty{display:none}
.fut .sp{position:absolute;left:0;right:0;top:6.6cqw;text-align:center;font-size:4.4cqw;font-weight:700;letter-spacing:.4cqw;text-transform:uppercase}
.t-bronze{--c1:#7a4a25;--c2:#cf9560;--bd1:#f3c999;--bd2:#8a5a30;--fg:#2c1708;--pat:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 2px,transparent 2px 11px)}
.t-silver{--c1:#97a1b0;--c2:#e6ebf2;--bd1:#fff;--bd2:#8b95a4;--fg:#1a2430;--pat:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 1px,transparent 1px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 1px,transparent 1px 12px)}
.t-gold{--c1:#c79a2e;--c2:#f8e48f;--bd1:#fff3b8;--bd2:#a67c1a;--fg:#3a2a05;--pat:radial-gradient(circle,rgba(255,255,255,.5) 0 1px,transparent 1.6px),repeating-linear-gradient(120deg,transparent 0 9px,rgba(255,255,255,.12) 9px 10px);--pz:16px 16px,auto}
.t-none{--c1:#2b3446;--c2:#5b667c;--bd1:#9aa5ba;--bd2:#4a5468;--fg:#e8ecf5;--pat:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 1px,transparent 1px 10px)}
.t-rare{--c1:#a9680f;--c2:#ffd75e;--bd1:#fff0a8;--bd2:#8f5a0a;--fg:#2e1d03;--pat:repeating-linear-gradient(120deg,transparent 0 9px,rgba(255,255,255,.14) 9px 10px)}
.t-elite{--c1:#0a1747;--c2:#3a5ce0;--bd1:#f7e9ad;--bd2:#b8913a;--fg:#f6e9b4;--pat:radial-gradient(circle,rgba(255,255,255,.35) 0 1px,transparent 1.6px);--pz:20px 20px}
.t-potw{--c1:#04111d;--c2:#0fb0d4;--bd1:#9af0ff;--bd2:#0b6f8c;--fg:#e4fbff;--pat:repeating-linear-gradient(115deg,transparent 0 13px,rgba(255,255,255,.08) 13px 15px)}
.t-potm{--c1:#1c0734;--c2:#9333ea;--bd1:#f0c4ff;--bd2:#6d28d9;--fg:#fbe9ff;--pat:radial-gradient(circle,rgba(255,255,255,.28) 0 1.6px,transparent 2.2px);--pz:16px 16px}
.t-poty{--c1:#050a26;--c2:#1f3f9a;--bd1:#ffe9a0;--bd2:#b18a2e;--fg:#ffe08a;--pat:radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(255,224,138,.5) 0 1px,transparent 1.6px);--pz:23px 23px,37px 37px}
.t-tots{--c1:#032419;--c2:#12a56a;--bd1:#ffeaa0;--bd2:#b18a2e;--fg:#fff1b8;--pat:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.09) 10px 11px),repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,255,255,.09) 10px 11px)}
.t-legend{--c1:#cdbd93;--c2:#fffaf0;--bd1:#fff4c4;--bd2:#b98f1c;--fg:#3a2c0a;--pat:radial-gradient(circle at 28% 18%,rgba(255,255,255,.85),transparent 42%),radial-gradient(circle at 82% 72%,rgba(212,175,55,.3),transparent 46%)}
.t-captain{--c1:#2e060b;--c2:#e0222f;--bd1:#ffd0d4;--bd2:#8f1019;--fg:#fff;--pat:linear-gradient(120deg,transparent 42%,rgba(0,0,0,.2) 42% 58%,transparent 58%)}
.t-rising{--c1:#6d1a52;--c2:#ff8a3d;--bd1:#ffd9a6;--bd2:#c2410c;--fg:#fff4df;--pat:repeating-conic-gradient(from 0deg at 78% 18%,rgba(255,255,255,.13) 0 6deg,transparent 6deg 12deg)}
.t-mvp{--c1:#080808;--c2:#3a3a3a;--bd1:#f6dc8c;--bd2:#8a6a1a;--fg:#f3d27a;--pat:repeating-linear-gradient(0deg,transparent 0 6px,rgba(243,210,122,.09) 6px 7px)}
.sx .fi::after,.t-rare .fi::after,.t-elite .fi::after{background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);background-size:260% 100%;animation:shn 4.5s linear infinite}
@keyframes shn{0%{background-position:150% 0}100%{background-position:-60% 0}}
@media (prefers-reduced-motion:reduce){.sx .fi::after,.t-rare .fi::after,.t-elite .fi::after{animation:none}.fut{transition:none}}

.fut .fx{position:absolute;inset:0;background:linear-gradient(118deg,transparent 0 24%,rgba(255,255,255,.16) 24% 25%,rgba(255,255,255,.06) 25% 45%,transparent 45%),linear-gradient(62deg,transparent 0 60%,rgba(0,0,0,.08) 60% 78%,transparent 78%)}
.fut .fr{position:absolute;inset:1.4cqw;clip-path:polygon(evenodd,50% 0%,73% 2.4%,100% 5.4%,100% 85%,50% 100%,0% 85%,0% 5.4%,27% 2.4%,50% 1.25%,72.19% 3.59%,98.25% 6.52%,98.25% 84.12%,50% 98.75%,1.75% 84.12%,1.75% 6.52%,27.8% 3.59%);background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.12) 38%,rgba(0,0,0,.3) 70%,rgba(255,255,255,.4))}
.fut .bt{position:absolute;left:30cqw;right:30cqw;top:125cqw;height:10cqw;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.04))}
.fut .ov b,.fut .st b,.fut .nm{text-shadow:0 .45cqw 0 rgba(255,255,255,.4),0 -.25cqw 0 rgba(0,0,0,.22)}
.fut .sk{position:absolute;right:9cqw;top:9cqw;width:7cqw;height:7cqw;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 1cqw #fff);animation:tw 3.2s ease-in-out infinite;pointer-events:none}
.fut .sk.s2{right:auto;left:14cqw;top:58cqw;width:4.5cqw;height:4.5cqw;animation-delay:1.4s}
@keyframes tw{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){.fut .sk{animation:none}.spi,.spi.on{transition:none}}
/* ===== ประกาศการ์ดพิเศษ ===== */
.spot{margin:4px 0 34px;padding:18px 20px 22px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);border-top:2px solid rgba(255,215,94,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.spot>h3{display:flex;align-items:center;gap:10px;font-size:17px;letter-spacing:.04em;margin:0}
.spot>h3::before{content:'';width:10px;height:10px;background:#ffd75e;transform:rotate(45deg);box-shadow:0 0 10px rgba(255,215,94,.8)}
.spot>h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,215,94,.6),transparent)}
.spl{display:flex;flex-wrap:wrap;gap:26px 30px;margin-top:14px}
.spb{width:200px;text-align:center}
.spt{margin-bottom:12px}
.spt b{display:inline-block;font-size:15px;letter-spacing:.14em;padding:2px 14px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);border-top:1px solid rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.35)}
.spt small{display:block;color:#a9b8e2;font-size:12px;margin-top:2px}
.sps{display:grid}
.spi{grid-area:1/1;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .9s,visibility 0s .9s}
.spi.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .9s}
.spn{margin-top:10px;font-weight:600;font-size:15px}
.spd{display:flex;gap:6px;justify-content:center;margin-top:8px}
.spd i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s,width .3s}
.spd i.on{background:#fff;width:18px;border-radius:4px}
/* ===== แท็บข้าง ===== */
.side{position:fixed;top:59px;right:0;bottom:0;width:340px;z-index:15;overflow-y:auto;padding:22px 20px 28px;color:#fff;background:linear-gradient(180deg,rgba(18,30,66,.78),rgba(7,12,30,.9));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid rgba(255,255,255,.14);box-shadow:-12px 0 40px rgba(0,0,0,.35);visibility:hidden;transform:translateX(105%);transition:transform .25s ease,visibility 0s .25s}
.side.open{visibility:visible;transform:none;transition:transform .25s ease}
.side h2{margin:6px 0 2px;text-align:center;font-size:20px}
.sd-card{max-width:210px;margin:4px auto 10px}
.sd-sub{text-align:center;color:#a9b8e2;font-size:13px;margin:0 0 4px}
.sd-score{display:flex;gap:12px;align-items:center;margin:16px 0 2px;padding:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px}
.sd-sm{font-size:12.5px;color:#a9b8e2;line-height:1.5}
.sd-list{margin-top:12px;display:grid;gap:6px}.sd-list div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(255,255,255,.07);border-radius:10px;font-size:13px}.sd-list span{color:#a9b8e2}
.sd-act{display:grid;gap:8px;margin-top:18px}.sd-act .r{display:flex;gap:8px}.sd-act .r button{flex:1}
.side button:not(.p){background:rgba(255,255,255,.08);color:#e7ecfb;border-color:rgba(255,255,255,.18)}
.side button:not(.p):hover{background:rgba(255,255,255,.16)}
.side button.x{color:#ff9aa2;border-color:rgba(255,120,130,.4)}
.xc{position:absolute;top:10px;right:10px;width:32px;height:32px;padding:0;border-radius:50%;display:grid;place-items:center}
.side .b em{color:#9fb0dc}.side .b .t{background:rgba(255,255,255,.1)}.side .b i{background:linear-gradient(180deg,#6aa6ff,#2f5be0)}
.side .empty{background:rgba(255,255,255,.07);color:#a9b8e2}
@media(min-width:900px){body.sp main{max-width:none;margin:0;padding-right:376px}}
@media(max-width:899px){
 .side{top:auto;left:0;width:auto;max-height:70vh;border-left:0;border-top:1px solid rgba(255,255,255,.14);border-radius:20px 20px 0 0;transform:translateY(105%)}
 body.sp main{padding-bottom:70vh}}
@media(max-width:620px){.top small{display:none}.lst{flex-wrap:wrap}.lst .bars{max-width:none;flex-basis:100%}.row{flex-wrap:wrap}.row .n{flex-basis:100%}.rt{width:100%}.rt button{flex:1}.bar1 input{max-width:none;margin:0;flex-basis:100%}}
@media print{.top,.bottom,.noprint,.side{display:none!important}body::before,body::after{display:none}html,body{background:#fff}main{color:var(--ink)}section{border:0;box-shadow:none;break-inside:avoid;padding:6px 0}}

</head>
<body>
<div class="top"><div><b>NK ELITE ACADEMY</b><small>Player Assessment</small>
  <nav class="tabs noprint"><a class="tab on" href="#" onclick="return goHome()">นักกีฬา</a><a class="tab" href="/view.html" target="_blank" rel="noopener">หน้าดูข้อมูล ↗</a></nav>
  <button id="out" class="noprint" onclick="logout()" hidden>ออกจากระบบ</button></div></div>
<main id="app"></main>
<aside id="side" class="side" aria-label="ข้อมูลนักกีฬา"></aside>
<dialog id="dlg">
  <h2 id="dt">เพิ่มนักกีฬา</h2>
  <div class="ph"><div id="f_prev" class="av big"></div><div class="phb">
    <button class="s" type="button" onclick="$('f_file').click()">เลือกรูป</button>
    <input id="f_file" type="file" accept="image/*" hidden onchange="pickPhoto(this)">
    <button class="s x" type="button" onclick="clearPhoto()">ลบรูป</button></div></div>
  <label>ชื่อ</label><input id="f_name" autocomplete="off" oninput="refreshPrev()">
  <label>ชื่อเล่น (แสดงบนการ์ด)</label><input id="f_nick" autocomplete="off" maxlength="16" oninput="refreshPrev()">
  <label>ตำแหน่ง</label><select id="f_pos" onchange="refreshPrev()"><option value="">— ไม่ระบุ —</option><option>ST</option><option>CF</option><option>LW</option><option>RW</option><option>CAM</option><option>CM</option><option>CDM</option><option>LB</option><option>RB</option><option>CB</option><option>GK</option></select>
  <div class="g2"><div><label>อายุ (ปี)</label><input id="f_age" type="number" oninput="refreshPrev()" min="3" max="30" inputmode="numeric"></div>
  <div><label>ส่วนสูง (ซม.)</label><input id="f_h" type="number" min="50" max="230" inputmode="decimal"></div>
  <div><label>น้ำหนัก (กก.)</label><input id="f_w" type="number" min="10" max="200" inputmode="decimal"></div></div>
  <label>ประเภทการ์ด</label><select id="f_sp" onchange="refreshPrev()"></select>
  <label>ข้อความบนการ์ด (ไม่บังคับ)</label><input id="f_spn" maxlength="24" placeholder="เช่น สัปดาห์ที่ 44 / ตุลาคม 2026" oninput="refreshPrev()">
  <div id="f_card" style="margin:16px auto 0;max-width:210px"></div>
  <div class="acts"><button onclick="dlg.close()">ยกเลิก</button><button class="p" id="f_save" onclick="savePlayer()">บันทึก</button></div>
</dialog>
<script>
const API = '/api/gas';
const D = [
 {n:'Domain 1: ด้านเทคนิค (Technical Skills)', s:'เทคนิค', g:[
  {t:'Ball Mastery', i:['Ball Control','First Touch','Dribbling','Change of Direction / Feinting (เปลี่ยนทิศทาง/หลอกคู่ต่อสู้)','Change of Speed (เปลี่ยนความเร็ว)']},
  {t:'Passing', i:['Passing Accuracy','Passing Weight/Pace','Passing Timing','Short Passing','Long Passing','Receiving']},
  {t:'1v1 Attacking', i:['Ability to Beat Opponent','Change of Pace','Change of Direction','Feinting','Ball Protection']},
  {t:'1v1 Defending', i:['Defensive Stance','Speed of Approach','Angle of Approach','Timing','Tackling','Interception']},
  {t:'Finishing', i:['Shooting Accuracy','Finishing Technique','Shot Selection','First-Time Finishing','Creating Shooting Opportunities']}]},
 {n:'Domain 2: ความเข้าใจเกม (Tactical Understanding)', s:'เข้าใจเกม', g:[{i:['Scanning','Awareness','Decision Making','Positioning','Support','Movement Off the Ball','Creating Space','Defensive Positioning','Transition: Attack → Defense','Transition: Defense → Attack']}]},
 {n:'Domain 3: สมรรถภาพทางกาย (Physical Development)', s:'ร่างกาย', g:[{i:['Speed','Acceleration','Agility','Coordination','Balance','Strength','Power','Endurance','Repeated Sprint Ability','Mobility']}]},
 {n:'Domain 4: ด้านจิตใจ (Psychological)', s:'จิตใจ', g:[{i:['Self-Confidence','Concentration','Motivation','Resilience','Willingness to Learn','Response to Mistakes','Response to Pressure','Courage to Make Decisions','Competitive Attitude']}]},
 {n:'Domain 5: พฤติกรรมและการอยู่ร่วมกับทีม (Social & Behavior)', s:'พฤติกรรม', g:[{i:['Discipline','Respect','Teamwork','Communication','Coach-ability (เปิดรับคำแนะนำจากโค้ช)','Responsibility','Sportsmanship','Attitude Toward Teammates','Attitude Toward Coaches','Punctuality','Effort']}]},
 {n:'Domain 6: ความฉลาดในการเล่นฟุตบอล (Football Intelligence)', s:'ไอคิวบอล', g:[{i:['อ่านสถานการณ์','คาดการณ์เหตุการณ์ล่วงหน้า','สแกนพื้นที่','รู้ว่าควรเล่นเมื่อไหร่','รู้ว่าควรเล่นอะไร','รู้ว่าควรเล่นไปพื้นที่ไหน','เข้าใจ Space','เข้าใจ Time','เข้าใจ Risk vs Reward','ปรับการเล่นตามสถานการณ์']}]}
];

let PW = sessionStorage.getItem('pw') || '';
let S = {players:[], asms:[], p:null, a:null, q:'', msg:'', sel:null};
const $ = id => document.getElementById(id), dlg = $('dlg');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function call(action, extra) {
  const r = await fetch(API, {method:'POST', body: JSON.stringify({pw:PW, action, ...extra})});
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (' + r.status + ') ' + txt.slice(0,120)); }
  if (j.error) throw new Error(j.error);
  return j;
}
// ---------- คะแนน ----------
const mean = v => v.length ? v.reduce((x,y)=>x+y,0)/v.length : null;
const dAvg = (a,di) => { const v=[]; D[di].g.forEach((g,gi)=>g.i.forEach((_,ii)=>{const s=a.scores[`${di}-${gi}-${ii}`]; if(s) v.push(s);})); return mean(v); };
const tAvg = a => mean(Object.values(a.scores||{}));
const f1 = n => n==null ? '-' : n.toFixed(1);
const lvl = n => n==null ? 'ยังไม่ประเมิน' : n>=4.5?'Excellent':n>=3.5?'Good':n>=2.5?'Developing':n>=1.5?'Needs Improvement':'Needs Significant Development';
const bars = a => `<div class="bars">${D.map((d,i)=>{const m=dAvg(a,i);return `<div class="b"><div class="t"><i style="height:${m?m/5*100:0}%"></i></div><span>${f1(m)}</span><em>${d.s}</em></div>`}).join('')}</div>`;
const byDate = (a,b) => (b.info.date||'').localeCompare(a.info.date||'') || (+b.info.no||0)-(+a.info.no||0);
const asmOf = pid => S.asms.filter(a=>a.playerId===pid).sort(byDate);
const stats = p => `อายุ ${p.age||'-'} ปี · ${p.height||'-'} ซม. · ${p.weight||'-'} กก.`;

const futStats = a => {
  const g = (di,gi,idx) => { const n = D[di].g[gi].i.length, v = []; (idx || [...Array(n).keys()]).forEach(ii => { const s = a.scores[`${di}-${gi}-${ii}`]; if (s) v.push(s); }); return v; };
  const sc = v => v.length ? Math.round(mean(v)*19.8) : null;   // คะแนน 1-5 -> 0-99
  return {PAC:sc(g(2,0,[0,1,2])), SHO:sc(g(0,4)), PAS:sc(g(0,1)), DRI:sc([...g(0,0),...g(0,2)]), DEF:sc([...g(0,3),...g(1,0,[7])]), PHY:sc(g(2,0,[4,5,6,7]))};
};
const POS = ['ST','CF','LW','RW','CAM','CM','CDM','LB','RB','CB','GK'];
const SPECIALS = {
  potw:['POTW','Player of the Week','ผู้เล่นยอดเยี่ยมประจำสัปดาห์'], potm:['POTM','Player of the Month','ผู้เล่นยอดเยี่ยมประจำเดือน'],
  poty:['POTY','Player of the Year','ผู้เล่นยอดเยี่ยมประจำปี'], tots:['TOTS','Team of the Season','ทีมยอดเยี่ยมประจำฤดูกาล'],
  legend:['LEGEND','Legend','ตำนานของอะคาเดมี'], captain:['CAPTAIN','Captain','กัปตันทีม'],
  rising:['RISING STAR','Rising Star','ดาวรุ่งพุ่งแรง'], mvp:['MVP','Most Valuable Player','ผู้เล่นทรงคุณค่า']};
function futCard(p) {
  const l = asmOf(p.id)[0], t = l ? tAvg(l) : null, s = l ? futStats(l) : {};
  const sp = SPECIALS[p.special] ? p.special : '';
  const tier = sp || (t==null ? 'none' : t>=4.5 ? 'elite' : t>=4 ? 'rare' : t>=3.5 ? 'gold' : t>=2.5 ? 'silver' : 'bronze');
  const v = k => s[k]==null ? '--' : s[k];
  const row = k => `<p><b>${v(k)}</b><span>${k}</span></p>`;
  return `<div class="fut t-${tier}${sp?' sx':''}"><div class="fo"></div><div class="fm"></div><div class="fi"><div class="fx"></div><div class="ry"></div><div class="bw">NK</div><div class="sw"></div><div class="fr"></div><div class="bt"></div>${sp ? `<div class="sp">${esc(SPECIALS[sp][0])}</div>` : ''}
    <div class="ov"><b>${t==null?'--':Math.round(t*19.8)}</b><span>${esc(p.pos||'—')}</span><i>NK</i></div>
    <div class="ph">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : `<em>${esc(String(p.name||'?').trim().charAt(0))}</em>`}</div>
    <div class="sk"></div><div class="sk s2"></div><div class="np"></div><div class="nm">${esc(p.nick||p.name)}</div><div class="ln"></div>
    <div class="st"><div>${row('PAC')}${row('SHO')}${row('PAS')}</div><div>${row('DRI')}${row('DEF')}${row('PHY')}</div></div>
    <div class="ft">${esc(p.spNote||'')}</div><div class="gl"></div></div></div>`;
}

// ---------- เอฟเฟกต์เอียงการ์ดตามเมาส์ ----------
let tEl = null;
const REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;
function tiltReset() { if (tEl) { tEl.style.removeProperty('--rx'); tEl.style.removeProperty('--ry'); tEl = null; } }
document.addEventListener('pointermove', e => {
  if (REDUCE || e.pointerType === 'touch') return;
  const f = e.target.closest ? e.target.closest('.fut') : null;
  if (tEl && tEl !== f) tiltReset();
  if (!f) return; tEl = f;
  const r = f.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
  f.style.setProperty('--ry', ((x-.5)*16).toFixed(1)+'deg'); f.style.setProperty('--rx', ((.5-y)*16).toFixed(1)+'deg');
  f.style.setProperty('--mx', (x*100).toFixed(0)+'%'); f.style.setProperty('--my', (y*100).toFixed(0)+'%');
});

// ---------- ประกาศการ์ดพิเศษ ----------
function specials() {
  const g = {}; S.players.forEach(p => { if (SPECIALS[p.special]) (g[p.special] = g[p.special] || []).push(p); });
  const keys = Object.keys(SPECIALS).filter(k => g[k]); if (!keys.length) return '';
  return `<div class="spot"><h3>ประกาศการ์ดพิเศษ</h3><div class="spl">${keys.map(k => {
    const ps = [...g[k]].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'th'));
    return `<div class="spb"><div class="spt"><b>${esc(SPECIALS[k][0])}</b><small>${esc(SPECIALS[k][2])}</small></div>
      <div class="sps">${ps.map((p,i)=>`<div class="spi${i?'':' on'}"><div class="fc${S.sel===p.id?' sel':''}" data-id="${p.id}" onclick="pick('${p.id}')">${futCard(p)}</div><div class="spn">${esc(p.nick||p.name)}</div></div>`).join('')}</div>
      ${ps.length>1?`<div class="spd">${ps.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div>`:''}</div>`; }).join('')}</div></div>`;
}
let spT = null;
function startRot() {
  clearInterval(spT);
  spT = setInterval(() => document.querySelectorAll('.spb').forEach(b => {
    const it = [...b.querySelectorAll('.spi')]; if (it.length < 2 || b.matches(':hover')) return;
    const i = it.findIndex(x=>x.classList.contains('on')), j = (i+1) % it.length;
    it[i].classList.remove('on'); it[j].classList.add('on');
    b.querySelectorAll('.spd i').forEach((d,k)=>d.classList.toggle('on', k===j));
  }), 4000);
}

// ---------- แท็บข้าง ----------
function sideHtml(p) {
  const as = asmOf(p.id), l = as[0], t = l ? tAvg(l) : null;
  const dm = l ? D.map((d,i)=>({s:d.s,m:dAvg(l,i)})).filter(x=>x.m!=null) : [];
  const best = dm.length ? dm.reduce((a,b)=>b.m>a.m?b:a) : null, low = dm.length>1 ? dm.reduce((a,b)=>b.m<a.m?b:a) : null;
  const df = as[1] ? t - tAvg(as[1]) : null;
  const rows = l ? `<div class="sd-list"><div><span>ด้านเด่นสุด</span><b>${best?best.s+' ('+f1(best.m)+')':'-'}</b></div><div><span>ด้านที่ควรพัฒนา</span><b>${low?low.s+' ('+f1(low.m)+')':'-'}</b></div><div><span>เทียบครั้งก่อน</span><b>${df==null?'ประเมินครั้งแรก':(df>0?'▲ +':df<0?'▼ ':'● ')+df.toFixed(1)}</b></div></div>` : '';
  return `<button class="s xc" onclick="closeSide()" aria-label="ปิด">✕</button>
  <div class="sd-card">${futCard(p)}</div>
  <h2>${esc(p.name)}</h2>${p.nick?`<p class="sd-sub">ชื่อเล่น “${esc(p.nick)}”</p>`:''}<p class="sd-sub">${p.pos?esc(p.pos)+' · ':''}${stats(p)}</p>
  ${l ? `<div class="sd-score"><div class="pill"><b>${f1(t)}</b><small>/ 5</small></div><div><b>${lvl(t)}</b><div class="sd-sm">ประเมินล่าสุด ${esc(l.info.date)} · ครั้งที่ ${esc(l.info.no)}<br>ประเมินแล้ว ${as.length} ครั้ง</div></div></div>${bars(l)}${rows}` : '<div class="empty">ยังไม่มีผลประเมิน</div>'}
  <div class="sd-act"><button class="p" onclick="openPlayer('${p.id}')">เข้าไปประเมิน →</button>
  <div class="r"><button class="s" onclick="openDlg('${p.id}')">แก้ไข</button><button class="s x" onclick="delPlayer('${p.id}')">ลบ</button></div></div>`;
}
function closeSide() {
  S.sel = null; $('side').classList.remove('open'); document.body.classList.remove('sp');
  document.querySelectorAll('.fc.sel').forEach(e=>e.classList.remove('sel'));
}
function pick(id) {
  if (S.sel === id) return closeSide();
  const p = S.players.find(x=>x.id===id); if (!p) return;
  S.sel = id; $('side').innerHTML = sideHtml(p); $('side').scrollTop = 0;
  $('side').classList.add('open'); document.body.classList.add('sp');
  document.querySelectorAll('.fc').forEach(e=>e.classList.toggle('sel', e.dataset.id===id));
}
function goHome() { if (PW) home(); return false; }

// ---------- เข้าสู่ระบบ ----------
function login() {
  $('out').hidden = true;
  $('app').innerHTML = `<div class="login"><h2>เข้าสู่ระบบโค้ช</h2><p class="mut" style="margin:0 0 6px">NK ELITE ACADEMY</p>
  <label>รหัสผ่าน</label><input id="pw" type="password" autofocus onkeydown="if(event.key==='Enter')doLogin()">
  <p class="mut" style="color:#b4232d;min-height:20px">${esc(S.msg)}</p><button class="p" style="width:100%" onclick="doLogin()">เข้าสู่ระบบ</button></div>`;
}
async function doLogin() {
  PW = $('pw').value;
  try { await load(); sessionStorage.setItem('pw',PW); S.msg=''; await home(); }
  catch(e) { S.msg = e.message; login(); }
}
function logout() { sessionStorage.removeItem('pw'); PW=''; closeSide(); login(); }
async function load() {
  const [p, a] = await Promise.all([call('list',{sheet:'Players'}), call('list',{sheet:'Assessments'})]);
  S.players = p.rows.filter(x=>x && x.id && typeof x.name==='string');
  S.asms = a.rows.filter(x=>x && x.id && x.info && x.scores);
}

// ---------- หน้าแรก: คลังการ์ด ----------
async function home() {
  closeSide(); $('out').hidden = false; S.p = null; S.a = null; S.view = '';
  $('app').innerHTML = '<p class="mut">กำลังโหลด...</p>';
  await load();
  $('app').innerHTML = `${specials()}<div class="bar1"><div><h1>นักกีฬา</h1><span class="mut">${S.players.length} คน · การ์ดคำนวณจากการประเมินล่าสุด (เต็ม 99)</span></div>
    <input id="q" placeholder="ค้นหาชื่อ" value="${esc(S.q)}" oninput="S.q=this.value;cards()"><button class="p" onclick="openDlg()">+ เพิ่มนักกีฬา</button></div>
    <div class="grid fg" id="list"></div>`;
  cards(); startRot();
}
function cards() {
  const q = S.q.trim().toLowerCase();
  const ps = S.players.filter(p=>!SPECIALS[p.special]&&(String(p.name||'')+' '+String(p.nick||'')).toLowerCase().includes(q)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'th'));
  $('list').innerHTML = ps.length ? ps.map(p=>`<div class="fc${S.sel===p.id?' sel':''}" data-id="${p.id}" onclick="pick('${p.id}')">${futCard(p)}</div>`).join('')
    : `<div class="empty" style="grid-column:1/-1">${S.players.length?(q?'ไม่พบชื่อที่ค้นหา':'นักกีฬาทุกคนอยู่ในส่วนการ์ดพิเศษ'):'ยังไม่มีนักกีฬา กด “เพิ่มนักกีฬา” เพื่อเริ่มต้น'}</div>`;
}

// ---------- เพิ่ม/แก้ไข/ลบ นักกีฬา ----------
let editId = null, photoData;
function showPrev(d) { $('f_prev').innerHTML = d ? `<img src="${esc(d)}" alt="">` : esc((($('f_name').value||'?').trim().charAt(0))||'?'); refreshPrev(); }
function fillSp() {
  if ($('f_sp').options.length) return;
  $('f_sp').innerHTML = '<option value="">อัตโนมัติ (ตามคะแนนประเมิน)</option>' + Object.entries(SPECIALS).map(([k,v])=>`<option value="${k}">${v[0]} · ${v[2]}</option>`).join('');
}
function curP() {
  const old = editId ? (S.players.find(x=>x.id===editId)||{}) : {};
  return {...old, name:$('f_name').value.trim()||'ชื่อนักกีฬา', nick:$('f_nick').value.trim(), age:+$('f_age').value||'', pos:$('f_pos').value, special:$('f_sp').value, spNote:$('f_spn').value.trim(),
    photo: photoData===undefined ? (old.photo||'') : photoData};
}
function refreshPrev() { $('f_card').innerHTML = futCard(curP()); }
function openDlg(id) {
  editId = id || null; const p = id ? S.players.find(x=>x.id===id) : {}; photoData = undefined;
  $('dt').textContent = id ? 'แก้ไขข้อมูลนักกีฬา' : 'เพิ่มนักกีฬา';
  $('f_name').value = p.name||''; $('f_nick').value = p.nick||''; $('f_age').value = p.age||''; $('f_h').value = p.height||''; $('f_w').value = p.weight||''; $('f_pos').value = p.pos||''; fillSp(); $('f_sp').value = p.special||''; $('f_spn').value = p.spNote||'';
  showPrev(p.photo||''); dlg.showModal(); $('f_name').focus();
}
function pickPhoto(inp) {
  const f = inp.files[0]; if (!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const c = document.createElement('canvas'), x = c.getContext('2d'), s = Math.min(img.width, img.height);
    let n = 256, q = .85, d;
    const draw = () => { c.width = c.height = n; x.clearRect(0,0,n,n); x.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, n, n); d = c.toDataURL('image/webp', q); };
    draw();
    while (d.length > 30000 && n > 96) { if (q > .4 && d.startsWith('data:image/webp')) q -= .1; else n -= 32; draw(); }
    photoData = d; showPrev(d); URL.revokeObjectURL(u);
  };
  img.onerror = () => alert('เปิดไฟล์รูปนี้ไม่ได้ ลองรูปอื่น (JPG/PNG)');
  img.src = u; inp.value = '';
}
function clearPhoto() { photoData = ''; showPrev(''); }
async function savePlayer() {
  const name = $('f_name').value.trim(); if (!name) return alert('กรุณากรอกชื่อ');
  const old = editId ? S.players.find(x=>x.id===editId) : {};
  const data = {name, nick:$('f_nick').value.trim(), age:+$('f_age').value||'', height:+$('f_h').value||'', weight:+$('f_w').value||'', pos:$('f_pos').value, special:$('f_sp').value, spNote:$('f_spn').value.trim(), photo: photoData===undefined ? (old.photo||'') : photoData};
  if (editId) data.id = editId;
  $('f_save').disabled = true;
  try {
    await call('save',{sheet:'Players', data}); dlg.close();
    if (S.view==='player') openPlayer(editId); else { await home(); if (editId) pick(editId); }
  }
  catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
  $('f_save').disabled = false;
}
async function delPlayer(id) {
  const p = S.players.find(x=>x.id===id), n = asmOf(id).length;
  if (!confirm(`ลบ “${p.name}” และผลประเมินทั้งหมด ${n} ครั้ง?\nการลบกู้คืนไม่ได้`)) return;
  try { for (const a of asmOf(id)) await call('delete',{sheet:'Assessments', id:a.id}); await call('delete',{sheet:'Players', id}); home(); }
  catch(e) { alert('ลบไม่สำเร็จ: '+e.message); }
}

// ---------- หน้านักกีฬา: ประวัติการประเมิน ----------
async function openPlayer(id) {
  S.view = 'player'; closeSide(); await load();
  const p = S.p = S.players.find(x=>x.id===id); if (!p) return home();
  const as = asmOf(id);
  $('app').innerHTML = `<p><button onclick="S.view='';home()">← นักกีฬาทั้งหมด</button></p>
  <div class="phd">${futCard(p)}<div class="pin"><h2>${esc(p.name)}${p.nick?' ('+esc(p.nick)+')':''}</h2><p class="mut" style="margin:2px 0">${stats(p)}${p.pos?' · '+esc(p.pos):''}</p>
    <div class="acts2"><button class="s" onclick="openDlg('${id}')">แก้ไข</button><button class="s x" onclick="delPlayer('${id}')">ลบ</button></div></div></div>
  <div class="bar1"><h3>ประวัติการประเมิน</h3><button class="p" style="margin-left:auto" onclick="newAsm()">+ ประเมินครั้งใหม่</button></div>
  <section>${as.length ? as.map(a=>`<div class="lst"><div class="pill"><b>${f1(tAvg(a))}</b><small>/ 5</small></div>
    <div class="mid" onclick="openAsm('${a.id}')"><b>ครั้งที่ ${esc(a.info.no)}</b><div class="mut">${esc(a.info.date)} · ${lvl(tAvg(a))}${a.info.coach?' · โค้ช '+esc(a.info.coach):''}</div></div>
    ${bars(a)}<span style="display:flex;gap:6px"><button class="s" onclick="openAsm('${a.id}')">เปิด/แก้ไข</button><button class="s x" onclick="delAsm('${a.id}')">ลบ</button></span></div>`).join('') : '<div class="empty">ยังไม่เคยประเมิน</div>'}</section>`;
}
async function delAsm(id) {
  if (!confirm('ลบผลประเมินครั้งนี้? การลบกู้คืนไม่ได้')) return;
  try { await call('delete',{sheet:'Assessments', id}); openPlayer(S.p.id); } catch(e) { alert('ลบไม่สำเร็จ: '+e.message); }
}

// ---------- แบบประเมิน ----------
const setp = (path, v) => { const k=path.split('.'); let o=S.a; k.slice(0,-1).forEach(x=>o=o[x]); o[k.at(-1)]=v; };
function newAsm() {
  const p = S.p, n = asmOf(p.id).length + 1;
  S.a = {playerId:p.id, info:{name:p.name, age:p.age, height:p.height, weight:p.weight, date:new Date().toISOString().slice(0,10), coach:'', no:String(n)}, scores:{}, note:'',
    text:{obs:{strength:'',need:'',advice:'',next:''}, strengths:['','',''], improve:['','',''], goals:['','',''], actions:['','','']}};
  form();
}
function openAsm(id) { S.a = JSON.parse(JSON.stringify(S.asms.find(a=>a.id===id))); form(); scrollTo(0,0); }
function rate(k,v) { if (S.a.scores[k]===v) delete S.a.scores[k]; else S.a.scores[k]=v; const y=scrollY; form(); scrollTo(0,y); }
const ta = (path,label,val,h) => `<label>${label}</label><textarea oninput="setp('${path}',this.value)" ${h?`style="min-height:${h}px"`:''}>${esc(val)}</textarea>`;
const inp = (path,label,val,type) => `<div><label>${label}</label><input ${type?`type="${type}"`:''} value="${esc(val)}" oninput="setp('${path}',this.value)"></div>`;

function form() {
  S.view = 'form'; const a=S.a, t=a.text, i=a.info;
  let h = `<p class="noprint"><button onclick="openPlayer('${a.playerId}')">← กลับ</button></p>
  <section><div class="dh"><h2>แบบประเมินพัฒนาการนักกีฬา</h2><span class="mut">เฉลี่ยรวม <b style="color:var(--red);font-size:20px">${f1(tAvg(a))}</b> / 5</span></div>
   <div class="g2">${inp('info.name','ชื่อนักกีฬา',i.name)}${inp('info.age','อายุ (ปี)',i.age,'number')}${inp('info.height','ส่วนสูง (ซม.)',i.height,'number')}${inp('info.weight','น้ำหนัก (กก.)',i.weight,'number')}
   ${inp('info.date','วันที่ประเมิน',i.date,'date')}${inp('info.coach','โค้ช',i.coach)}${inp('info.no','ครั้งที่',i.no)}</div>
   <p class="mut" style="margin:12px 0 0;font-size:12px">5 Excellent · 4 Good · 3 Developing · 2 Needs Improvement · 1 Needs Significant Development</p></section>`;
  D.forEach((d,di)=>{
    h += `<section><div class="dh"><h3>${d.n}</h3><span class="mut">เฉลี่ย <b>${f1(dAvg(a,di))}</b></span></div>`;
    d.g.forEach((g,gi)=>{
      if (g.t) h += `<h3 style="margin:16px 0 2px;color:var(--navy2)">${g.t}</h3>`;
      g.i.forEach((it,ii)=>{ const k=`${di}-${gi}-${ii}`;
        h += `<div class="row"><span class="n">${esc(it)}</span><div class="rt">${[1,2,3,4,5].map(v=>`<button class="${a.scores[k]===v?'on':''}" aria-pressed="${a.scores[k]===v}" onclick="rate('${k}',${v})">${v}</button>`).join('')}</div></div>`; });
    });
    h += '</section>';
  });
  h += `<section class="noprint"><h3>ให้ AI ช่วยร่างข้อความ</h3>
   <p class="mut" style="margin:4px 0">AI ใช้คะแนนด้านบนเป็นหลัก ใส่ข้อสังเกตเพิ่ม (เช่น พฤติกรรมในเกม อาการบาดเจ็บ) เพื่อให้ผลแม่นขึ้น แล้วแก้ไขผลได้ก่อนบันทึก</p>
   <textarea oninput="S.a.note=this.value" placeholder="ข้อสังเกตเพิ่มเติมของโค้ช">${esc(a.note)}</textarea>
   <p><button class="d" id="aib" onclick="runAI()">ร่างข้อความด้วย AI</button> <span class="mut" id="aim"></span></p></section>
  <section><h3>Coach’s Observation</h3>${ta('text.obs.strength','จุดเด่น',t.obs.strength)}${ta('text.obs.need','สิ่งที่ต้องพัฒนา',t.obs.need)}${ta('text.obs.advice','คำแนะนำสำหรับการฝึก',t.obs.advice)}${ta('text.obs.next','เป้าหมายรอบถัดไป',t.obs.next)}</section>
  <section><h3>Individual Development Plan</h3>
   ${[0,1,2].map(n=>ta(`text.strengths.${n}`,`Top Strength ${n+1}`,t.strengths[n],44)).join('')}
   ${[0,1,2].map(n=>ta(`text.improve.${n}`,`Area to Improve ${n+1}`,t.improve[n],44)).join('')}</section>
  <section><h3>Next 4–8 Week Goals</h3>${[0,1,2].map(n=>ta(`text.goals.${n}`,`Goal ${n+1}`,t.goals[n],44)).join('')}
   <h3 style="margin-top:20px">Coach’s Action Plan</h3>${[0,1,2].map(n=>ta(`text.actions.${n}`,`Action ${n+1}`,t.actions[n],44)).join('')}
   <p class="mut">โค้ช: ${esc(i.coach)}</p></section>
  <div class="bottom noprint"><span class="mut" id="sm"></span>${a.id?'<button class="x" onclick="delAsmForm()">ลบ</button>':''}<button onclick="print()">พิมพ์ / PDF</button><button class="p" onclick="saveAsm()">บันทึก</button></div>`;
  $('app').innerHTML = h;
}
async function saveAsm() {
  $('sm').textContent = 'กำลังบันทึก...';
  try { S.a.id = (await call('save',{sheet:'Assessments', data:S.a})).id; $('sm').textContent = 'บันทึกแล้ว ✓'; }
  catch(e) { $('sm').textContent = 'บันทึกไม่สำเร็จ: '+e.message; }
}
async function delAsmForm() {
  if (!confirm('ลบผลประเมินครั้งนี้? การลบกู้คืนไม่ได้')) return;
  try { await call('delete',{sheet:'Assessments', id:S.a.id}); openPlayer(S.a.playerId); } catch(e) { alert('ลบไม่สำเร็จ: '+e.message); }
}
async function runAI() {
  const sc = {}; D.forEach((d,di)=>d.g.forEach((g,gi)=>g.i.forEach((it,ii)=>{const v=S.a.scores[`${di}-${gi}-${ii}`]; if(v) (sc[d.n]=sc[d.n]||[]).push(`${g.t?g.t+': ':''}${it} = ${v}`);})));
  if (!Object.keys(sc).length) return alert('กรุณาให้คะแนนอย่างน้อยบางหัวข้อก่อน');
  $('aib').disabled = true; $('aim').textContent = 'AI กำลังวิเคราะห์... (อาจใช้เวลา 10–30 วินาที)';
  try {
    const info = {age:S.a.info.age, height:S.a.info.height, weight:S.a.info.weight};
    const r = (await call('ai',{payload:{info, scores:sc, note:S.a.note}})).result;
    const f = (arr,n) => Array.from({length:n},(_,i)=>(arr&&arr[i])||'');
    S.a.text = {obs:{strength:'',need:'',advice:'',next:'',...r.observation}, strengths:f(r.strengths,3), improve:f(r.improve,3), goals:f(r.goals,3), actions:f(r.actions,3)};
    form(); scrollTo({top:document.body.scrollHeight*0.45}); 
  } catch(e) { $('aib').disabled = false; $('aim').textContent = 'ผิดพลาด: '+e.message; }
}

(async()=>{
  if (!PW) return login();
  try { await home(); }
  catch(e) {
    if (/รหัสผ่าน/.test(e.message)) return logout();
    $('app').innerHTML = `<section><h3>โหลดข้อมูลไม่สำเร็จ</h3><p class="mut">${esc(e.message)}</p><button class="p" onclick="location.reload()">ลองใหม่</button></section>`;
    $('out').hidden = false;
  }
})();
</script>
